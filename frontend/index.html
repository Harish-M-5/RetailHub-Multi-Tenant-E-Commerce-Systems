<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RetailHub - Multi-Tenant Retail SaaS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Plus Jakarta Sans: owner dashboard's default typeface (crisp, modern,
         reads well in stat cards/tables). Fraunces: storefront's display
         serif for big headings (hero, product names, section titles) -
         paired with Poppins for storefront body/button text. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:wght@500;600;700;900&family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply dark/light theme before React mounts to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem("retailhub-theme");
          var theme = stored || "light";
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

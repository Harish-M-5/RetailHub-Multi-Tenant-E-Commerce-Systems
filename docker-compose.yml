version: "3.8"

services:
  backend:
    build: ./backend
    container_name: retailhub-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build: ./frontend
    container_name: retailhub-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  uploads_data:
